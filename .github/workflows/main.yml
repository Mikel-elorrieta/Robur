name: Build IPA (sin firmar)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Robur
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)" && xcodebuild -version

      - name: Generar proyecto con XcodeGen
        run: |
          brew install xcodegen
          rm -rf Robur.xcodeproj
          xcodegen generate
          xcodebuild -list -project Robur.xcodeproj

      - name: Archive (sin firma)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Robur.xcodeproj \
            -scheme Robur \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Robur.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unre|BUILD|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" build/xcodebuild.log

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: Robur/build/xcodebuild.log

      - name: Empaquetar IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Robur.xcarchive/Products/Applications/Robur.app build/Payload/
          cd build && zip -qr Robur.ipa Payload && ls -la Robur.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Robur-ipa
          path: Robur/build/Robur.ipa
