name: Robur
options:
  bundleIdPrefix: com.mikel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
targets:
  Robur:
    type: application
    platform: iOS
    sources: [Robur]
    entitlements:
      path: Robur/Robur.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Robur/Info.plist
      properties:
        CFBundleDisplayName: Robur
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Robur lee tus pasos, minutos de ejercicio, energía activa y peso.
        NSHealthUpdateUsageDescription: Robur guarda tus entrenos de fuerza y tu peso en Salud.
        NSCameraUsageDescription: Robur usa la cámara para fotos de progreso y análisis de comidas.
        NSPhotoLibraryUsageDescription: Robur accede a tus fotos para el registro de progreso y la cámara IA.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
